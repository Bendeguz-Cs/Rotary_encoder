name: Compile Examples

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        board:
          - arduino:avr:nano
          - arduino:avr:uno
          - arduino:megaavr:uno2018:mode=on

    steps:
      - uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Install board support
        run: |
          arduino-cli core install arduino:avr
          arduino-cli core install arduino:megaavr

      - name: Install library dependencies
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "PinChangeInterrupt" "Adafruit NeoPixel"

      - name: Compile examples
        run: |
          failed=0
          for example in examples/*/*.ino; do
            echo "::group::Compiling $(basename "$example") for ${{ matrix.board }}"
            if ! arduino-cli compile --fqbn "${{ matrix.board }}" --library . "$(dirname "$example")"; then
              echo "::error::Failed to compile $(basename "$example")"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
